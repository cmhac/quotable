[project]
name = "gridkey"
version = "0.1.0"
description = "Extract tables from PDFs with a vision LLM, then check every value against the PDF's text layer."
readme = "README.md"
authors = [
    { name = "Chris Hacker", email = "christopher.hacker@washpost.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "pymupdf==1.28.2",
]

[project.optional-dependencies]
# Only needed for the bundled OpenAI-backed client; any object with an async
# ``ask`` method works as a client.
openai = ["pydantic-ai-slim[openai]==2.54.0"]

[dependency-groups]
dev = [
    "pre-commit==4.5.1",
    "pytest==8.4.2",
    "ruff==0.16.10",
    "ty==0.0.85",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that call a real model are opt-in: ``pytest -m live``.
addopts = "-m 'not live'"
markers = ["live: calls a real LLM API (costs money, needs an API key)"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D", "A", "C4", "UP", "SIM", "RET", "PTH", "DTZ", "PL"]
ignore = ["D212", "D203"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]
