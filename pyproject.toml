[project]
name = "quotable"
version = "0.1.0"
description = "Extract tables from PDFs with a vision LLM, then check every value against the PDF's text layer."
readme = "README.md"
authors = [
    { name = "Chris Hacker", email = "christopher.hacker@washpost.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "pymupdf==1.28.2",
    # Every provider SDK pydantic-ai supports, except the extras that pull in PyTorch.
    "pydantic-ai-slim[anthropic,bedrock,cohere,google,groq,huggingface,mistral,openai,openrouter,xai]==2.54.0",
    # OCR for pages with no text or a garbled one (spec 006, 019): installed with quotable where
    # PaddlePaddle publishes a wheel (macOS arm64, Linux x86_64, Windows x86_64, Python 3.9 to
    # 3.13; checked on PyPI for 3.3.1). Elsewhere nothing is installed and a document that needs
    # OCR raises OcrUnavailableError. NVIDIA users swap in paddlepaddle-gpu (see the README).
    "paddleocr==3.7.0; python_version < '3.14' and ((sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64'))",
    "paddlepaddle==3.3.1; python_version < '3.14' and ((sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64'))",
]

[project.scripts]
quotable = "quotable.__main__:main"

[project.optional-dependencies]
# DataFrame output (Table.to_pandas / Table.to_polars). Ranges, not pins: quotable is installed
# into its own environment (spec 008). Optional since spec 015.
pandas = ["pandas>=3,<4"]
polars = ["polars>=2,<3"]

[dependency-groups]
dev = [
    "pandas>=3,<4",
    "polars>=2,<3",
    "pre-commit==4.5.1",
    "pytest==8.4.2",
    "pytest-xdist==3.8.0",
    "ruff==0.16.10",
    "ty==0.0.85",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that call a real model (``-m live``) or run the real OCR models (``-m ocr``) are opt-in.
addopts = "-m 'not live and not ocr'"
markers = [
    "live: calls a real LLM API (costs money, needs an API key)",
    "ocr: runs the real PaddleOCR models (slow, downloads models on first use, no API cost)",
]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    # a table that failed warns when it is read (spec 019); a test that does not expect it fails
    "error::quotable.errors.TableFailedWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D", "A", "C4", "UP", "SIM", "RET", "PTH", "DTZ", "PL"]
ignore = ["D212", "D203"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]
