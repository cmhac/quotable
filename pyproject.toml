[project]
name = "quotable"
version = "0.1.0"
description = "Extract tables from PDFs with a vision LLM, then check every value against the PDF's text layer."
readme = "README.md"
authors = [
    { name = "Chris Hacker", email = "christopher.hacker@washpost.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "pymupdf==1.28.2",
    # Every provider SDK pydantic-ai supports, except the extras that pull in PyTorch.
    "pydantic-ai-slim[anthropic,bedrock,cohere,google,groq,huggingface,mistral,openai,openrouter,xai]==2.54.0",
    # Ranges, not pins: quotable is installed into its own environment (spec 008).
    "pandas>=3,<4",
    "polars>=2,<3",
]

[project.optional-dependencies]
# OCR for pages whose text layer is garbled or missing (spec 006). ``ocr`` is complete on the
# CPU; ``ocr-core`` is for NVIDIA users, who install a GPU build of PaddlePaddle themselves.
ocr = ["paddleocr==3.7.0", "paddlepaddle==3.3.1"]
ocr-core = ["paddleocr==3.7.0"]

[dependency-groups]
dev = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "pre-commit==4.5.1",
    "pytest==8.4.2",
    "ruff==0.16.10",
    "ty==0.0.85",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that call a real model (``-m live``) or run the real OCR models (``-m ocr``) are opt-in.
addopts = "-m 'not live and not ocr'"
markers = [
    "live: calls a real LLM API (costs money, needs an API key)",
    "ocr: runs the real PaddleOCR models (slow, downloads models on first use, no API cost)",
]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D", "A", "C4", "UP", "SIM", "RET", "PTH", "DTZ", "PL"]
ignore = ["D212", "D203"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]
